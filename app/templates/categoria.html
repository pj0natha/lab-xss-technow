<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TechNow - Categoria</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>TechNow</h1>
        <nav>
            <a href="/">Noticias</a>
            <a href="/contato">Contato</a>
        </nav>
    </header>
    <main>
        <h2>Categoria: {{ nome | safe }}</h2>

        <div class="grid">
            {% for post in posts %}
            <div class="card">
                <h3><a href="/post/{{ post.id }}">{{ post.titulo }}</a></h3>
            </div>
            {% else %}
            <p>Nenhuma noticia encontrada nesta categoria.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
