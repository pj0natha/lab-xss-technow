<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TechNow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>TechNow</h1>
        <nav>
            <a href="/">Noticias</a>
            <a href="/contato">Contato</a>
        </nav>
    </header>
    <main>
        <form action="/buscar" method="get" class="busca-form">
            <input type="text" name="q" placeholder="Buscar noticias...">
            <button type="submit">Buscar</button>
        </form>

        <h2>Ultimas noticias</h2>
        <div class="grid">
            {% for post in posts %}
            <div class="card">
                <h3><a href="/post/{{ post.id }}">{{ post.titulo }}</a></h3>
                <p class="categoria"><a href="/categoria/{{ post.categoria }}">{{ post.categoria }}</a></p>
                <p>{{ post.resumo }}</p>
            </div>
            {% endfor %}
        </div>
    </main>
    <footer>
        <p style="text-align:center; color:#5a6478; padding:1rem;">&copy; 2026 TechNow</p>
    </footer>
</body>
</html>
