<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TechNow - Busca</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>TechNow</h1>
        <nav>
            <a href="/">Noticias</a>
            <a href="/contato">Contato</a>
        </nav>
    </header>
    <main>
        <form action="/buscar" method="get" class="busca-form">
            <input type="text" name="q" placeholder="Buscar noticias..." value="{{ q }}">
            <button type="submit">Buscar</button>
        </form>

        <h2>Resultados para: {{ q | safe }}</h2>

        <div class="grid">
            {% for post in resultados %}
            <div class="card">
                <h3><a href="/post/{{ post.id }}">{{ post.titulo }}</a></h3>
                <p class="categoria">{{ post.categoria }}</p>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
